; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno_r4_wifi

[env]
platform = renesas-ra@1.9.0
board = uno_r4_wifi
framework = arduino

; Deve acompanhar VELOCIDADE_SERIAL em include/config.h.
monitor_speed = 9600

[env:uno_r4_wifi]
extra_scripts = pre:scripts/load_env.py
; O firmware completo usa main.cpp e seus módulos.
build_src_filter = +<*> -<benches/>

; WiFiS3 faz parte do framework da placa; ArduinoOTA e externa.
lib_deps =
    https://github.com/JAndrassy/ArduinoOTA/archive/refs/tags/1.1.1.zip

[env:uno_r4_wifi_ph]
build_src_filter = +<benches/ph-bench.cpp>
